name: Build SN-R1 ImmortalWrt 25.12 Firmware

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-snr1-2512:
    runs-on: ubuntu-22.04
    env:
      TARGET_ARCH: mediatek
      TARGET_SUBARCH: filogic
      DEVICE_PROFILE: globenet_sn-r1
      DTS_PATH: kernel/arch/arm64/boot/dts/mediatek/mt7981-sn-r1.dts
      FW_VERSION: 25.12

    steps:
      # 步骤1：拉取源码（修复点1：增加子模块拉取，确保scripts/config完整）
      - name: Checkout ImmortalWrt 25.12 Source
        uses: actions/checkout@v4
        with:
          ref: openwrt-25.12
          fetch-depth: 0
          submodules: recursive  # 新增：拉取所有子模块（含scripts/config依赖）

      # 步骤2：安装依赖（修复点2：补充25.12 scripts/config必需依赖）
      - name: Install Full Dependencies for 25.12
        run: |
          sudo apt update -y && sudo apt full-upgrade -y
          # 新增：libncurses-dev/libtinfo-dev（scripts/config编译必需）
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libncurses-dev libtinfo-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
          file wget curl qemu-utils device-tree-compiler swig libpcap-dev libelf-dev python3-pip \
          libffi-dev python3-dev
          # 修复点3：安装最新版make（解决25.12与默认make版本兼容问题）
          sudo apt install -y make --upgrade
          sudo apt autoremove -y && sudo apt clean -y
          pip3 install --upgrade pip setuptools

      # 步骤3：替换设备树（保持不变，仅需确认你的Raw链接正确）
      - name: Deploy Custom SN-R1 DTS (25.12)
        run: |
          # ########## 替换为你的kernel.dts Raw链接 ##########
          wget -O custom-sn-r1.dts https://raw.githubusercontent.com/justemu/immortalwrt/openwrt-25.12/SN-R1/kernel.dts
          # ##################################################
          
          mkdir -p $(dirname ${{ env.DTS_PATH }})
          cp custom-sn-r1.dts ${{ env.DTS_PATH }}
          echo "✅ 设备树已替换"
          
          # 校验设备树语法
          dtc -I dts -O dtb -o /tmp/test.dtb ${{ env.DTS_PATH }}
          if [ $? -ne 0 ]; then
            echo "❌ 设备树语法错误！"
            exit 1
          fi

      # 步骤4：配置编译参数（修复点4：显式指定编译器，解决scripts/config兼容问题）
      - name: Configure SN-R1 Build (25.12)
        run: |
          # 新增：显式指定CC=gcc，避免clang编译scripts/config报错
          export CC=gcc
          export CXX=g++
          
          # 加载基础配置
          make defconfig TARGET=${{ env.TARGET_ARCH }} TARGET_SUBTARGET=${{ env.TARGET_SUBARCH }} PROFILE=${{ env.DEVICE_PROFILE }}
          
          # 1G内存+25.12优化
          echo "CONFIG_DEVEL=y" >> .config
          echo "CONFIG_CCACHE=y" >> .config
          echo "CONFIG_EXTRA_OPTIMIZATION=-Os" >> .config
          # 128G eMMC配置
          echo "CONFIG_TARGET_ROOTFS_PARTSIZE=102400" >> .config
          echo "CONFIG_TARGET_EXT4_BLOCKSIZE=4096" >> .config
          echo "CONFIG_TARGET_USES_UBIFS=y" >> .config
          # eMMC驱动
          echo "CONFIG_MMC_EMMC=y" >> .config
          echo "CONFIG_MEDIATEK_MMC=y" >> .config
          echo "CONFIG_MTD=y" >> .config
          
          make defconfig

      # 步骤5：下载依赖（保持不变）
      - name: Download 25.12 Dependencies
        run: |
          make download -j1
          find dl -size -1024c -exec rm -f {} \;

      # 步骤6：编译固件（修复点5：先单独编译scripts/config，再编译固件）
      - name: Build SN-R1 25.12 Firmware
        run: |
          # 新增：先单独编译scripts/config，确保该工具正常
          make -j1 scripts/config/conf V=s
          # 再编译固件
          make -j1 V=s 2>&1 | tee sn-r1-2512-build.log
          
          # 检查固件
          FW_FILE=$(ls bin/targets/${{ env.TARGET_ARCH }}/${{ env.TARGET_SUBARCH }}/*.img 2>/dev/null)
          if [ -z "$FW_FILE" ]; then
            echo "❌ 编译失败，日志："
            cat sn-r1-2512-build.log
            exit 1
          fi
          echo "✅ 编译成功：$FW_FILE"

      # 步骤7：上传产物（保持不变）
      - name: Upload 25.12 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SN-R1-ImmortalWrt-25.12
          path: |
            bin/targets/**/*.bin
            bin/targets/**/*.img
            sn-r1-2512-build.log
          retention-days: 90

      # 步骤8：自动Release（保持不变）
      - name: Create 25.12 Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: SN-R1-25.12-$(date +%Y%m%d)
          name: SN-R1 ImmortalWrt 25.12 $(date +%Y%m%d)
          files: bin/targets/${{ env.TARGET_ARCH }}/${{ env.TARGET_SUBARCH }}/*.img
          body: |
            全球牛SN-R1 ImmortalWrt 25.12 适配固件
            硬件：MT7981/1GB内存/128GB eMMC
            编译时间：$(date +%Y-%m-%d %H:%M:%S)
