name: Compile ImmortalWrt 25.12 for bt-snr1 (Space Optimized)

on:
  workflow_dispatch:
    inputs:
      build_description:
        description: '编译描述（可选）'
        required: false
        default: 'bt-snr1 25.12 - 空间优化版'

jobs:
  compile_firmware:
    runs-on: ubuntu-22.04
    env:
      CFLAGS: "-Wno-gcc-compat -Wno-include-next -O2 -ffunction-sections -fdata-sections"
      CXXFLAGS: "-Wno-gcc-compat -Wno-include-next -O2 -ffunction-sections -fdata-sections"
      LDFLAGS: "-Wl,--gc-sections"
      TMPDIR: /tmp/immortalwrt-build
      TARGET_DEVICE: bt-snr1
      DOWNLOAD_RETRY: 3

    steps:
      - name: 1. 极致前置清理
        run: |
          set +e
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell /usr/local/lib/node_modules /opt/miniconda /usr/share/maven \
            /usr/local/go /usr/lib/jvm /var/cache/apt/archives/* || true
          sudo apt autoremove -y --purge && sudo apt clean -y || true
          sudo rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/* ~/.cache/* || true
          set -e
          mkdir -p $TMPDIR && chmod 777 $TMPDIR
          sudo apt purge -y linux-headers-* linux-image-* linux-modules-* || true
          echo "=== 前置清理后磁盘空间 ==="
          df -h /
          du -sh /usr/share/ /opt/ /usr/local/ | sort -hr || true

      - name: 2. 拉取源码
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: openwrt-25.12
          fetch-depth: 1
          sparse-checkout: |
            target/
            scripts/
            include/
            package/
            feeds.conf.default
          fail-fast: false

      - name: 3. 安装最小化编译依赖
        run: |
          sudo apt update -y --fix-missing || true
          sudo apt install -y --no-install-recommends \
            build-essential clang flex bison g++-12 gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
            file wget curl jq time libelf-dev libncursesw5-dev autoconf automake libtool \
            texinfo patch pkg-config meson ninja-build || true
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 100 || true
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 100 || true
          sudo apt clean -y && sudo rm -rf /var/lib/apt/lists/* || true
          echo "=== 依赖安装后磁盘空间 ==="
          df -h /

      - name: 4. 修正第三方Feeds源
        run: |
          sudo > feeds.conf.default || true
          echo "src-git packages https://github.com/immortalwrt/packages.git;openwrt-25.12" | sudo tee -a feeds.conf.default || true
          echo "src-git luci https://github.com/immortalwrt/luci.git;openwrt-25.12" | sudo tee -a feeds.conf.default || true
          echo "src-git routing https://github.com/openwrt/routing.git;openwrt-25.12" | sudo tee -a feeds.conf.default || true
          echo "src-git telephony https://github.com/openwrt/telephony.git;openwrt-25.12" | sudo tee -a feeds.conf.default || true
          echo "src-git small https://github.com/kenzok8/small-package.git" | sudo tee -a feeds.conf.default || true
          cat feeds.conf.default || true

      - name: 5. 处理Feeds
        run: |
          rm -rf feeds/small/webd feeds/small/dogcom feeds/small/istorepanel || true
          ./scripts/feeds clean --force || true
          ./scripts/feeds update -a -f -t $DOWNLOAD_RETRY || true
          ./scripts/feeds install -a --skip-broken || true
          rm -rf feeds/*/.git feeds/*/.github feeds/*/.svn tmp/ build_dir/tmp/* || true
          echo "=== Feeds处理后磁盘空间 ==="
          df -h /

      - name: 6. 生成编译配置
        run: |
          sudo echo -e "CONFIG_TARGET_mediatek=y\nCONFIG_TARGET_mediatek_filogic=y\nCONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${TARGET_DEVICE}=y" > .config || true
          sudo echo -e "CONFIG_ALL_NONSHARED=n\nCONFIG_ALL_KMODS=n\nCONFIG_ALL_PACKAGES=n\nCONFIG_DEBUG=n\nCONFIG_PACKAGE_kmod-usb*=n\nCONFIG_PACKAGE_luci-app-*=n\nCONFIG_PACKAGE_luci-app-easymesh=y\nCONFIG_PACKAGE_ddns-go=y\nCONFIG_PACKAGE_vlmcsd=y" >> .config || true
          make defconfig || true
          cat .config | grep -E "TARGET_DEVICE|${TARGET_DEVICE}" || true

      - name: 7. 下载依赖包
        run: |
          make -j1 download V=s -t $DOWNLOAD_RETRY || true
          find ./dl -size -1024c -exec rm -f {} \; || true
          find ./dl -name "*.tar.gz" -exec gzip -9 {} \; 2>/dev/null || true
          find ./dl -name "*.*.*" -type f -exec rm -f {} \; || true
          echo "=== 依赖下载后磁盘空间 ==="
          df -h /

      - name: 8. 编译前终极清理
        run: |
          sudo rm -rf /tmp/* $TMPDIR/* build_dir/tmp/* staging_dir/tmp/* dl/*.tmp || true
          sudo rmmod nf_conntrack 2>/dev/null || true
          sudo sync && sudo echo 1 > /proc/sys/vm/drop_caches || true
          sudo sync && sudo echo 2 > /proc/sys/vm/drop_caches || true
          sudo sync && sudo echo 3 > /proc/sys/vm/drop_caches || true
          echo "=== 编译前最终磁盘空间 ==="
          df -h /
          free -h

      - name: 9. 编译固件
        run: |
          mkdir -p /dev/shm/build_tmp && chmod 777 /dev/shm/build_tmp 
          export TMPDIR=/dev/shm/build_tmp
          make -j1 V=s 2>&1 | grep -v "warning: #include_next is a GCC extension" 
          echo "=== 编译完成后固件列表 ==="
          ls -lh bin/targets/mediatek/filogic/ || true
          echo "=== 编译完成后磁盘空间 ==="
          df -h /

      - name: 10. 上传固件
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bt-snr1-immortalwrt-25.12-optimized
          path: |
            bin/targets/mediatek/filogic/*${TARGET_DEVICE}*.bin
            bin/targets/mediatek/filogic/*${TARGET_DEVICE}*.manifest
          retention-days: 90

      - name: 11. 编译后清理
        if: always()
        run: |
          echo "=== 最终磁盘使用详情 ==="
          df -h || true
          echo "=== 各目录体积 ==="
          du -sh build_dir/ staging_dir/ bin/ dl/ | sort -hr || true
