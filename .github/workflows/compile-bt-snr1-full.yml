name: Compile ImmortalWrt 25.12 for bt-snr1
on:
  workflow_dispatch:
    inputs:
      build_description:
        description: '编译描述（可选）'
        required: false
        default: 'bt-snr1 25.12 全功能版'

jobs:
  compile_firmware:
    runs-on: ubuntu-22.04
    env:
      TARGET_DEVICE: bt-snr1

    steps:
      - name: 1. 拉取源码
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: openwrt-25.12
          fetch-depth: 1

      - name: 2. 安装编译依赖
        run: |
          sudo apt update && sudo apt upgrade -y
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget \
          curl jq time libelf-dev libncursesw5-dev autoconf automake libtool autopoint \
          texinfo patch pkg-config meson ninja-build

      - name: 3. 配置Feeds源
        run: |
          > feeds.conf.default
          echo "src-git packages https://github.com/immortalwrt/packages.git;openwrt-25.12" >> feeds.conf.default
          echo "src-git luci https://github.com/immortalwrt/luci.git;openwrt-25.12" >> feeds.conf.default
          echo "src-git routing https://github.com/openwrt/routing.git;openwrt-25.12" >> feeds.conf.default
          echo "src-git telephony https://github.com/openwrt/telephony.git;openwrt-25.12" >> feeds.conf.default
          echo "src-git small https://github.com/kenzok8/small-package.git" >> feeds.conf.default
          cat feeds.conf.default

      - name: 4. 更新&安装Feeds
        run: |
          ./scripts/feeds clean
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 5. 生成编译配置
        run: |
          echo -e "CONFIG_TARGET_mediatek=y\nCONFIG_TARGET_mediatek_filogic=y\nCONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${TARGET_DEVICE}=y" > .config
          make defconfig

      - name: 6. 下载依赖包
        run: |
          make -j$(nproc) download V=s
          find ./dl -size -1024c -exec rm -f {} \;

      - name: 7. 编译前磁盘清理（仅保留这一步清理）  
        run: |
          # 仅清理临时文件，不删除任何依赖/配置
          sudo rm -rf /tmp/* /var/tmp/* ~/.cache/* || true
          # 修复权限问题：用sudo bash -c 包裹整个命令，确保重定向有root权限
          sudo sync && sudo bash -c "echo 3 > /proc/sys/vm/drop_caches" || true
          df -h /

      - name: 8. 编译固件
        run: |
          make -j2 V=s
          ls -lh bin/targets/mediatek/filogic/

      - name: 9. 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: bt-snr1-immortalwrt-25.12
          path: |
            bin/targets/mediatek/filogic/*.bin
            bin/targets/mediatek/filogic/*.manifest
          retention-days: 90
