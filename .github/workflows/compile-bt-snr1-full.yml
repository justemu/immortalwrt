name: Compile ImmortalWrt 25.12 for bt-snr1 (Space Optimized)

on:
  workflow_dispatch:
    inputs:
      build_description:
        description: '编译描述（可选）'
        required: false
        default: 'bt-snr1 25.12 - 空间优化版'

jobs:
  compile_firmware:
    runs-on: ubuntu-22.04
    env:
      # 1. 全局环境优化：屏蔽警告+限定临时目录
      CFLAGS: "-Wno-gcc-compat -Wno-include-next -O2 -ffunction-sections -fdata-sections"
      CXXFLAGS: "-Wno-gcc-compat -Wno-include-next -O2 -ffunction-sections -fdata-sections"
      LDFLAGS: "-Wl,--gc-sections"  # 剥离无用符号，减少编译产物体积
      TMPDIR: /tmp/immortalwrt-build  # 统一临时目录，便于清理
      # 限定仅编译bt-snr1设备，避免编译其他设备浪费空间
      TARGET_DEVICE: bt-snr1

    steps:
      - name: 1. 极致前置清理（修复语法+容错，核心！）
        run: |
          set +e  # 关闭bash严格模式，避免单个目录删除失败终止
          # 逐个删除大体积冗余目录（拆分命令，避免解析错误），不存在则忽略
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/local/lib/node_modules || true
          sudo rm -rf /opt/miniconda || true
          sudo rm -rf /usr/share/maven || true
          # 清理系统缓存（分开执行，避免权限问题）
          sudo apt autoremove -y --purge || true
          sudo apt clean -y || true
          sudo rm -rf /var/lib/apt/lists/* || true
          sudo rm -rf /tmp/* /var/tmp/* || true
          rm -rf ~/.cache/* || true  # 非sudo，runner用户自己的缓存
          set -e  # 恢复严格模式
          # 创建专用临时目录，避免权限问题
          mkdir -p $TMPDIR && chmod 777 $TMPDIR
          # 验证清理效果
          echo "=== 前置清理后磁盘空间 ==="
          df -h /
          du -sh /usr/share/ /opt/ /usr/local/ | sort -hr

      - name: 2. 拉取源码（浅克隆+仅拉取必要分支，减少空间）
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: openwrt-25.12
          fetch-depth: 1  # 仅拉取最新提交，不克隆历史（减少~1-2GB）


      - name: 3. 安装最小化编译依赖（仅装必需，减少空间）
        run: |
          sudo apt update -y
          # 仅安装ImmortalWrt编译必需依赖，--no-install-recommends避免冗余
          sudo apt install -y --no-install-recommends \
            build-essential clang flex bison g++-12 gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
            file wget curl jq time libelf-dev libncursesw5-dev autoconf automake libtool \
            texinfo patch pkg-config meson ninja-build
          # 设GCC 12为默认，减少兼容性警告
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 100
          # 清理apt缓存（释放~500MB）
          sudo apt clean -y && sudo rm -rf /var/lib/apt/lists/*
          echo "=== 依赖安装后磁盘空间 ==="
          df -h /

      - name: 3. 修正第三方Feeds源（解决目录不匹配）
        run: |
          # 清空原有feeds.conf.default，避免冲突
          > feeds.conf.default
          # 添加ImmortalWrt官方默认feeds（必须先加）
          echo "src-git packages https://github.com/immortalwrt/packages.git;openwrt-25.12" >> feeds.conf.default
          echo "src-git luci https://github.com/immortalwrt/luci.git;openwrt-25.12" >> feeds.conf.default
          echo "src-git routing https://github.com/openwrt/routing.git;openwrt-25.12" >> feeds.conf.default
          echo "src-git telephony https://github.com/openwrt/telephony.git;openwrt-25.12" >> feeds.conf.default
          
          # 添加第三方源（修正名称与路径，确保目录匹配）
          echo "src-git small https://github.com/kenzok8/small-package.git" >> feeds.conf.default
          # echo "src-git passwall https://github.com/xiaorouji/openwrt-passwall.git;main" >> feeds.conf.default
          # echo "src-git tailscale https://github.com/adyanth/openwrt-tailscale.git;main" >> feeds.conf.default
          
          # 验证Feeds配置
          cat feeds.conf.default


      - name: 4. 处理Feeds（清理缓存，减少下载体积）
        run: |
          # 强制清理旧feeds缓存
          ./scripts/feeds clean --force
          # 仅更新必需feeds（避免全量更新浪费空间）
          ./scripts/feeds update -a -f

          # 清理feeds临时文件
          rm -rf tmp/ feeds/*/.svn feeds/*/.github
          echo "=== Feeds处理后磁盘空间 ==="
          df -h /

      - name: 5. 生成编译配置（限定仅编译目标设备，避免冗余）
        run: |
          # 仅生成bt-snr1设备的配置，不编译其他设备
          echo -e "CONFIG_TARGET_mediatek=y\nCONFIG_TARGET_mediatek_filogic=y\nCONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${TARGET_DEVICE}=y" > .config
          # 禁用不必要的编译选项（减少临时文件生成）
          echo -e "CONFIG_ALL_NONSHARED=n\nCONFIG_ALL_KMODS=n\nCONFIG_ALL_PACKAGES=n\nCONFIG_DEBUG=n" >> .config
          make defconfig
          # 验证配置仅包含目标设备
          cat .config | grep -E "TARGET_DEVICE|${TARGET_DEVICE}"

      - name: 6. 下载依赖包（单线程+清理无效文件）
        run: |
          # 单线程下载，避免并行下载生成冗余临时文件
          make -j1 download V=s
          # 删除小于1KB的无效下载文件（避免占用空间）
          find ./dl -size -1024c -exec rm -f {} \;
          # 压缩下载目录（可选，释放~200MB）
          find ./dl -name "*.tar.gz" -exec gzip -9 {} \; 2>/dev/null
          echo "=== 依赖下载后磁盘空间 ==="
          df -h /

      - name: 7. 编译前终极清理（释放最后可用空间）
        run: |
          # 清空系统临时文件+编译临时目录
          sudo rm -rf /tmp/* $TMPDIR/* build_dir/tmp/* staging_dir/tmp/*
          # 卸载无用内核模块（释放内存+磁盘缓存）
          sudo rmmod nf_conntrack 2>/dev/null
          # 同步磁盘缓存到硬盘，释放缓存空间
          sudo sync && sudo echo 3 > /proc/sys/vm/drop_caches
          echo "=== 编译前最终磁盘空间 ==="
          df -h /
          free -h

      - name: 8. 编译固件（单线程+内存盘缓存，核心优化）
        run: |
          # 关键：将编译临时文件放到内存盘（tmpfs），避免写磁盘占空间
          mkdir -p /dev/shm/build_tmp
          export TMPDIR=/dev/shm/build_tmp
          # 单线程编译（-j1）：避免并行生成大量临时文件，空间爆炸
          # V=s：详细日志；--gc-sections：剥离无用代码，减少产物体积
          make -j1 V=s IGNORE_ERRORS=1 2>&1 | grep -v "warning: #include_next is a GCC extension"
          # 验证固件生成
          echo "=== 编译完成后固件列表 ==="
          ls -lh bin/targets/mediatek/filogic/
          # 查看最终磁盘使用
          echo "=== 编译完成后磁盘空间 ==="
          df -h /

      - name: 9. 上传固件（仅保留核心文件，减少Artifact体积）
        uses: actions/upload-artifact@v4
        with:
          name: bt-snr1-immortalwrt-25.12-optimized
          path: |
            bin/targets/mediatek/filogic/*${TARGET_DEVICE}*.bin
            bin/targets/mediatek/filogic/*${TARGET_DEVICE}*.manifest
          retention-days: 90

      - name: 10. 编译后清理（便于调试）
        if: always()
        run: |
          # 输出磁盘/内存使用详情，便于排查空间问题
          echo "=== 最终磁盘使用详情 ==="
          df -h
          echo "=== 各目录体积 ==="
          du -sh build_dir/ staging_dir/ bin/ dl/ | sort -hr
          
