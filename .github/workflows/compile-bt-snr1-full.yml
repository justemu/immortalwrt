name: Compile ImmortalWrt 25.12 for bt-snr1 (Full Features + Tailscale)

on:
  workflow_dispatch:
    inputs:
      build_description:
        description: '编译描述（可选）'
        required: false
        default: 'bt-snr1 25.12 + EasyMesh + Dockerman + PassWall + DDNS-GO + Vlmcsd KMS + Tailscale'

jobs:
  compile_firmware:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. 拉取源码（25.12分支）
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: openwrt-25.12
          fetch-depth: 1

      - name: 2. 安装完整编译依赖
        run: |
          sudo apt update && sudo apt upgrade -y
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget \
          curl jq time libelf-dev libncursesw5-dev autoconf automake libtool autopoint \
          texinfo patch pkg-config meson ninja-build

      - name: 3. 修正第三方Feeds源（解决目录不匹配）
        run: |
          # 清空原有feeds.conf.default，避免冲突
          > feeds.conf.default
          # 添加ImmortalWrt官方默认feeds（必须先加）
          echo "src-git packages https://github.com/immortalwrt/packages.git;openwrt-25.12" >> feeds.conf.default
          echo "src-git luci https://github.com/immortalwrt/luci.git;openwrt-25.12" >> feeds.conf.default
          echo "src-git routing https://github.com/openwrt/routing.git;openwrt-25.12" >> feeds.conf.default
          echo "src-git telephony https://github.com/openwrt/telephony.git;openwrt-25.12" >> feeds.conf.default
          
          # 添加第三方源（修正名称与路径，确保目录匹配）
          echo "src-git small https://github.com/kenzok8/small-package.git" >> feeds.conf.default
          echo "src-git passwall https://github.com/xiaorouji/openwrt-passwall.git;main" >> feeds.conf.default
          echo "src-git tailscale https://github.com/adyanth/openwrt-tailscale.git;main" >> feeds.conf.default
          
          # 验证Feeds配置
          cat feeds.conf.default

      - name: 4. 更新&安装feeds（修正后）
        run: |
          ./scripts/feeds clean
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # 强制安装所有关键包
          ./scripts/feeds install \
            luci-app-dockerman \
            luci-app-passwall \
            luci-app-ddns-go \
            luci-app-easymesh \
            luci-app-vlmcsd \
            luci-app-tailscale

      - name: 5. 生成编译配置文件
        run: |
          echo -e "CONFIG_TARGET_mediatek=y\nCONFIG_TARGET_mediatek_filogic=y\nCONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_bt-snr1=y" > .config
          make defconfig
          # 验证所有包是否被正确识别
          cat .config | grep -E "CONFIG_PACKAGE_luci-app|CONFIG_PACKAGE_tailscale"

      - name: 6. 下载所有依赖包
        run: |
          make -j$(nproc) download V=s
          find ./dl -size -1024c -exec ls -l {} \;
          find ./dl -size -1024c -exec rm -f {} \;

      - name: 7. 编译固件（适配GitHub Action资源）
        run: |
          make -j2 V=s
          ls -lh bin/targets/mediatek/filogic/

      - name: 8. 上传固件到Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bt-snr1-immortalwrt-25.12-full-features-tailscale
          path: |
            bin/targets/mediatek/filogic/*.bin
            bin/targets/mediatek/filogic/*.manifest
          retention-days: 90
